name: PR Check

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & Test
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.16.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Electron binary
        run: node scripts/install-electron-binary.js

      - name: Typecheck
        run: node ./node_modules/@typescript/native/bin/tsc -b

      - name: Documentation claim audit
        run: bun scripts/check-doc-claims.js

      - name: Lint
        run: bash ./scripts/lint.sh

      - name: Test with coverage
        run: node --require ./tests/polyfill-crypto.cjs ./node_modules/vitest/vitest.mjs run --coverage 2>&1 | tee coverage-output.txt

      - name: 'Architecture: Circular deps'
        run: bunx madge --circular --extensions ts src/

      - name: 'Performance: Build production bundle'
        run: bun scripts/build-rsbuild.js

      - name: 'Playwright: e2e'
        run: |
          set +e
          set -o pipefail
          bunx playwright test --project=e2e 2>&1 | tee playwright-e2e.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            excerpt="$(tail -n 15 playwright-e2e.log | tr '\r\n' '  ' | cut -c1-1200)"
            echo "::error file=tests/e2e/user-workflows.test.ts::${excerpt}"
            exit "$status"
          fi

      - name: 'Playwright: integration'
        run: bunx playwright test --project=integration

      - name: 'Playwright: performance'
        run: bunx playwright test --project=performance

      - name: 'Playwright: preload-artifact'
        run: bunx playwright test --project=preload-artifact

      - name: 'Playwright: Upload failure artifacts'
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: 'Performance: Headless startup capture'
        run: node scripts/headless-startup.js
        env:
          # Per-run overall harness timeout (includes Electron boot + document load).
          HEADLESS_TIMEOUT_MS: '90000'
          # Capture timeout floor is also enforced in the finalizer when
          # GOGCHAT_EXPORT_METRICS=1; keep this high enough for cold CI loads.
          GOGCHAT_AUTO_QUIT_AFTER_MS: '45000'
          GOGCHAT_PERF_RUNS: '5'
          GOGCHAT_EXPORT_METRICS: '1'

      - name: 'Performance: Budget gate'
        run: node scripts/check-perf-budget.js performance-metrics.json

      - name: 'Performance: Upload metrics artifact'
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-metrics
          path: |
            performance-metrics.json
            .perf-history.json
            coverage-output.txt
            playwright-e2e.log
          if-no-files-found: ignore
          retention-days: 14
